name: Build postmarketOS for Galaxy A21s

on:
  workflow_dispatch:
    inputs:
      interface:
        description: User interface
        required: true
        default: console
        type: choice
        options:
          - console
          - xfce4
          - phosh

permissions:
  contents: read

jobs:
  build:
    name: Build A21s image
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    env:
      PMB_WORK: ${{ github.workspace }}/pmbootstrap-work
      PMAPORTS: ${{ github.workspace }}/pmaports
      OUTPUT: ${{ github.workspace }}/output

    steps:
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            binfmt-support \
            git \
            openssl \
            python3 \
            qemu-user-static \
            rsync \
            sudo \
            xz-utils

      - name: Download pmbootstrap and pmaports
        run: |
          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git \
            pmbootstrap

          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmaports.git \
            "$PMAPORTS"

          mkdir -p "$HOME/.local/bin"
          ln -s "$GITHUB_WORKSPACE/pmbootstrap/pmbootstrap.py" \
            "$HOME/.local/bin/pmbootstrap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Add experimental Galaxy A21s port
        run: |
          git clone --depth=1 --branch mainline \
            https://github.com/samsungexynos850/pmos-a21s.git \
            a21s-port

          mkdir -p "$PMAPORTS/device/testing"
          cp -a a21s-port/device-samsung-a21s \
            "$PMAPORTS/device/testing/"
          cp -a a21s-port/linux-postmarketos-exynos850 \
            "$PMAPORTS/device/testing/"

          # The experimental aport references an unpublished touchscreen
          # firmware package. The current DTS has no touchscreen node yet, so
          # omit that dependency for the initial boot image.
          sed -i '/^[[:space:]]*firmware-samsung-a21s-ts-fw[[:space:]]*$/d' \
            "$PMAPORTS/device/testing/device-samsung-a21s/APKBUILD"

      - name: Configure pmbootstrap
        env:
          PMOS_UI: ${{ inputs.interface }}
        run: |
          PMB_CONFIG="$HOME/.config/pmbootstrap_v3.cfg"
          PMB_WORK_VERSION="$(
            python3 -c \
              'import sys; sys.path.insert(0, "pmbootstrap"); import pmb.config; print(pmb.config.work_version)'
          )"

          mkdir -p "$HOME/.config" "$PMB_WORK/cache_git"
          printf '%s\n' "$PMB_WORK_VERSION" > "$PMB_WORK/version"

          printf '%s\n' \
            '[pmbootstrap]' \
            "aports = $PMAPORTS" \
            "work = $PMB_WORK" \
            'build_pkgs_on_install = True' \
            'device = samsung-a21s' \
            'extra_space = 512' \
            'hostname = galaxy-a21s' \
            "jobs = $(nproc)" \
            'locale = en_US.UTF-8' \
            'timezone = GMT' \
            "ui = $PMOS_UI" \
            'user = pmos' \
            '' \
            '[providers]' \
            '' \
            '[mirrors]' \
            > "$PMB_CONFIG"

          chmod 600 "$PMB_CONFIG"
          pmbootstrap status

      - name: Update local package checksums
        run: |
          pmbootstrap checksum linux-postmarketos-exynos850
          pmbootstrap checksum device-samsung-a21s

      - name: Build kernel
        run: |
          pmbootstrap build linux-postmarketos-exynos850 \
            --arch aarch64 \
            --force

      - name: Collect kernel artifacts
        run: |
          mkdir -p "$OUTPUT/kernel"

          find "$PMB_WORK/packages" -type f \
            -name 'linux-postmarketos-exynos850-*.apk' \
            -exec cp {} "$OUTPUT/kernel/" \;

          find "$PMB_WORK/chroot_buildroot_aarch64/home/pmos/build" -type f \
            \( -path '*/arch/arm64/boot/Image' \
               -o -name 'exynos850-a217f-3gb.dtb' \) \
            -exec cp {} "$OUTPUT/kernel/" \; || true

          test -n "$(find "$OUTPUT/kernel" -type f -name '*.apk' -print -quit)"
          find "$OUTPUT/kernel" -type f -exec ls -lh {} \;

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-a21s-mainline-kernel
          path: output/kernel/
          if-no-files-found: error
          retention-days: 14

      - name: Build postmarketOS image
        env:
          PMOS_PASSWORD: ${{ secrets.PMOS_PASSWORD }}
        run: |
          if [ -z "$PMOS_PASSWORD" ]; then
            PMOS_PASSWORD="147147"
          fi

          pmbootstrap install \
            --password "$PMOS_PASSWORD" \
            --filesystem ext4 \
            --no-sparse

      - name: Export rootfs and Samsung boot files
        run: |
          mkdir -p "$OUTPUT"
          pmbootstrap export --odin "$OUTPUT"

          cd "$OUTPUT"
          find . -type f ! -name SHA256SUMS \
            -exec sha256sum {} \; > SHA256SUMS
          find . -maxdepth 2 -type f -exec ls -lh {} \;

      - name: Upload postmarketOS images
        uses: actions/upload-artifact@v4
        with:
          name: postmarketOS-galaxy-a21s-${{ inputs.interface }}
          path: output/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14

      - name: Upload build log after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postmarketOS-build-log
          path: pmbootstrap-work/log.txt
          if-no-files-found: ignore
          retention-days: 14
