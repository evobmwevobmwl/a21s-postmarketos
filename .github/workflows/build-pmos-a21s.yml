name: Build postmarketOS recovery ZIP for Galaxy A21s

on:
  workflow_dispatch:
    inputs:
      interface:
        description: User interface
        required: true
        default: console
        type: choice
        options:
          - console
          - xfce4
          - phosh

permissions:
  contents: read

jobs:
  build:
    name: Build A21s recovery ZIP
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      PMB_WORK: ${{ github.workspace }}/pmbootstrap-work
      PMAPORTS: ${{ github.workspace }}/pmaports
      OUTPUT: ${{ github.workspace }}/output
      PREBUILT_KERNEL: linux-postmarketos-exynos850-7.2.0-r0.apk

    steps:
      - name: Check out prebuilt kernel and CI files
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            binfmt-support \
            git \
            openssl \
            python3 \
            qemu-user-static \
            rsync \
            sudo \
            xz-utils

      - name: Download pmbootstrap and pmaports
        run: |
          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git \
            pmbootstrap

          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmaports.git \
            "$PMAPORTS"

          mkdir -p "$HOME/.local/bin"
          ln -s "$GITHUB_WORKSPACE/pmbootstrap/pmbootstrap.py" \
            "$HOME/.local/bin/pmbootstrap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Add Galaxy A21s port and prebuilt kernel
        run: |
          git clone --depth=1 --branch mainline \
            https://github.com/samsungexynos850/pmos-a21s.git \
            a21s-port

          mkdir -p "$PMAPORTS/device/testing"
          cp -a a21s-port/device-samsung-a21s \
            "$PMAPORTS/device/testing/"
          cp -a ci/linux-prebuilt \
            "$PMAPORTS/device/testing/linux-postmarketos-exynos850"
          cp "$GITHUB_WORKSPACE/$PREBUILT_KERNEL" \
            "$PMAPORTS/device/testing/linux-postmarketos-exynos850/"

          # This package is referenced by the experimental port but is not
          # published in pmaports yet. The current mainline DTS has no
          # touchscreen node, so it is not needed for the initial boot.
          sed -i '/^[[:space:]]*firmware-samsung-a21s-ts-fw[[:space:]]*$/d' \
            "$PMAPORTS/device/testing/device-samsung-a21s/APKBUILD"

          sed -i \
            's/deviceinfo_flash_method="fastboot"/deviceinfo_flash_method="heimdall-bootimg"/' \
            "$PMAPORTS/device/testing/device-samsung-a21s/deviceinfo"

          test -f "$PMAPORTS/device/testing/linux-postmarketos-exynos850/$PREBUILT_KERNEL"
          ! grep -q 'firmware-samsung-a21s-ts-fw' \
            "$PMAPORTS/device/testing/device-samsung-a21s/APKBUILD"
          grep -q 'deviceinfo_flash_method="heimdall-bootimg"' \
            "$PMAPORTS/device/testing/device-samsung-a21s/deviceinfo"

      - name: Configure pmbootstrap
        env:
          PMOS_UI: ${{ inputs.interface }}
        run: |
          PMB_CONFIG="$HOME/.config/pmbootstrap_v3.cfg"
          PMB_WORK_VERSION="$(
            python3 -c \
              'import sys; sys.path.insert(0, "pmbootstrap"); import pmb.config; print(pmb.config.work_version)'
          )"

          mkdir -p "$HOME/.config" "$PMB_WORK/cache_git"
          printf '%s\n' "$PMB_WORK_VERSION" > "$PMB_WORK/version"

          printf '%s\n' \
            '[pmbootstrap]' \
            "aports = $PMAPORTS" \
            "work = $PMB_WORK" \
            'build_pkgs_on_install = True' \
            'device = samsung-a21s' \
            'extra_space = 512' \
            'hostname = galaxy-a21s' \
            "jobs = $(nproc)" \
            'locale = en_US.UTF-8' \
            'timezone = GMT' \
            "ui = $PMOS_UI" \
            'user = pmos' \
            '' \
            '[providers]' \
            '' \
            '[mirrors]' \
            > "$PMB_CONFIG"

          chmod 600 "$PMB_CONFIG"
          pmbootstrap status

      - name: Update local package checksums
        run: |
          pmbootstrap checksum linux-postmarketos-exynos850
          pmbootstrap checksum device-samsung-a21s

      - name: Build TWRP recovery ZIP
        env:
          PMOS_PASSWORD: ${{ secrets.PMOS_PASSWORD }}
        run: |
          if [ -z "$PMOS_PASSWORD" ]; then
            PMOS_PASSWORD="147147"
          fi

          pmbootstrap install \
            --android-recovery-zip \
            --recovery-install-partition USERDATA \
            --password "$PMOS_PASSWORD"

      - name: Export recovery ZIP
        run: |
          mkdir -p "$OUTPUT/links" "$OUTPUT/artifacts"
          pmbootstrap export "$OUTPUT/links"

          find "$OUTPUT/links" -maxdepth 1 \
            \( -type f -o -type l \) \
            -exec cp -Lv {} "$OUTPUT/artifacts/" \;

          test -n "$(find "$OUTPUT/artifacts" -type f -name '*.zip' -print -quit)"

          cd "$OUTPUT/artifacts"
          find . -type f ! -name SHA256SUMS \
            -exec sha256sum {} \; > SHA256SUMS
          find . -maxdepth 1 -type f -exec ls -lh {} \;

      - name: Upload recovery ZIP
        uses: actions/upload-artifact@v4
        with:
          name: postmarketOS-galaxy-a21s-recovery-${{ inputs.interface }}
          path: output/artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build log after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postmarketOS-recovery-build-log
          path: pmbootstrap-work/log.txt
          if-no-files-found: ignore
          retention-days: 14
